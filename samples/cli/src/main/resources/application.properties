# Home Assistant connection — set via --hass-server and --hass-token CLI args
# or HASS_SERVER / HASS_TOKEN env vars
# quarkus.homeassistant.url=${hass-server:http://homeassistant.local:8123}
# quarkus.homeassistant.token=${hass-token}

# REST client URL is derived from quarkus.homeassistant.url via the extension
# quarkus.rest-client.homeassistant-api.url=${quarkus.homeassistant.url}

# Packaging
quarkus.package.jar.add-runner-suffix=false
quarkus.package.jar.type=uber-jar

# Logging
quarkus.banner.enabled=false
quarkus.log.level=WARN

# Native setup
quarkus.native.additional-build-args=-march=compatibility
